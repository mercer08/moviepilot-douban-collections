name: Release

on:
  push:
    tags:
      - "DoubanCollections_v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: |
          release_version="${GITHUB_REF_NAME#DoubanCollections_}"
          cd plugins.v2/doubancollections
          zip "${GITHUB_WORKSPACE}/doubancollections_${release_version}.zip" \
            README.md __init__.py douban.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#DoubanCollections_}"
          gh release create "$GITHUB_REF_NAME" \
            "doubancollections_${release_version}.zip" \
            --title "豆瓣分类榜单 ${release_version}" \
            --generate-notes
