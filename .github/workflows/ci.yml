name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend helpers
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile plugins.v2/doubancollections/__init__.py plugins.v2/doubancollections/douban.py

      - name: Validate marketplace manifest
        run: jq empty package.v2.json
